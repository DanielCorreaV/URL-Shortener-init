<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — SHRTN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white border border-slate-200 shadow-xl rounded-2xl w-full max-w-md p-8 relative overflow-hidden">
        <div class="flex items-center gap-3 mb-6 justify-center">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="lock" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900">SHRTN <span
                    class="text-indigo-600 font-medium">Cloud</span></span>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-6">
            <button id="tabLogin" onclick="switchAuthMode('login')"
                class="py-2 text-xs font-semibold rounded-lg bg-white text-slate-800 shadow-sm transition-all">Ingresar</button>
            <button id="tabRegister" onclick="switchAuthMode('register')"
                class="py-2 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all">Registrarse</button>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Nombre de
                    Usuario</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                    <input type="text" id="authUsername" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"
                        placeholder="Usuario">
                </div>
            </div>
            <div>
                <label
                    class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Contraseña</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                    <input type="password" id="authPassword" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:bg-white transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="authAlert"
                class="hidden text-xs bg-red-50 text-red-600 border border-red-200 p-3 rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="authAlertText">Error detectado</span>
            </div>

            <button type="submit" id="btnAuthSubmit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                <span>Iniciar Sesión</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
